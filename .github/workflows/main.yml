name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check project files
        shell: bash
        run: |
          echo "========================================"
          echo "CHECK PROJECT"
          echo "========================================"

          pwd
          ls -la

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "build_content.py" ]; then
            echo "ERROR: build_content.py tidak ditemukan!"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "OK: project files ditemukan."

      - name: Generate full learning content
        shell: bash
        run: |
          echo "========================================"
          echo "GENERATE FULL LEARNING CONTENT"
          echo "========================================"

          echo "Menjalankan build_content.py..."

          python build_content.py

          echo "Content generation selesai."

      - name: Check generated content
        shell: bash
        run: |
          echo "========================================"
          echo "CHECK GENERATED CONTENT"
          echo "========================================"

          if [ -d "assets" ]; then
            find assets -maxdepth 5 -type f | sort
          else
            echo "Folder assets tidak ditemukan."
          fi

      - name: Flutter clean
        run: |
          flutter clean

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze --no-fatal-infos

      - name: Build APK
        run: |
          flutter build apk --release

      - name: Check APK
        shell: bash
        run: |
          echo "========================================"
          echo "CHECK APK"
          echo "========================================"

          find build -type f -name "*.apk" -print

          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anjar-Nihong-Jepang-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build completed
        run: |
          echo "========================================"
          echo "BUILD BERHASIL!"
          echo "========================================"
