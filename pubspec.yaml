name: nihon_go_master_ultimate
description: NihonGo Master Ultimate - aplikasi belajar bahasa Jepang lengkap dengan JLPT, SRS, stroke order, speaking, listening dan AI tutor.
publish_to: "none"
version: 4.0.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.5.0
  flutter_tts: ^4.2.3
  speech_to_text: ^7.0.0
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/vocab.json
    - assets/data/kanji.json
    - assets/data/grammar.json
    - assets/data/strokes/
