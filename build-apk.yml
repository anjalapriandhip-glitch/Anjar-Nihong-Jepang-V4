name: Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. SETUP FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # 4. CHECK PROJECT
      # ==========================================
      - name: Check project files
        shell: bash
        run: |
          echo "========================================"
          echo "CHECK PROJECT"
          echo "========================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking pubspec.yaml..."

          if [ ! -f "pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          echo "OK: pubspec.yaml ditemukan."

          echo ""
          echo "Checking build_content.py..."

          if [ ! -f "build_content.py" ]; then
            echo "ERROR: build_content.py tidak ditemukan!"
            echo ""
            echo "Isi repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "OK: build_content.py ditemukan."

      # ==========================================
      # 5. GENERATE FULL LEARNING CONTENT
      # ==========================================
      - name: Generate full learning content
        shell: bash
        run: |
          echo "========================================"
          echo "GENERATE FULL LEARNING CONTENT"
          echo "========================================"

          echo ""
          echo "Menjalankan:"
          echo "python build_content.py"
          echo ""

          python build_content.py

          echo ""
          echo "Content generation selesai."

      # ==========================================
      # 6. CHECK GENERATED CONTENT
      # ==========================================
      - name: Check generated content
        shell: bash
        run: |
          echo "========================================"
          echo "CHECK GENERATED CONTENT"
          echo "========================================"

          echo ""
          echo "Mencari file hasil generate..."

          if [ -d "assets" ]; then
            find assets -maxdepth 5 -type f | sort
          else
            echo "Folder assets belum ada."
          fi

          echo ""
          echo "Content check selesai."

      # ==========================================
      # 7. FLUTTER CLEAN
      # ==========================================
      - name: Flutter clean
        shell: bash
        run: |
          echo "========================================"
          echo "FLUTTER CLEAN"
          echo "========================================"

          flutter clean

      # ==========================================
      # 8. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          echo "========================================"
          echo "INSTALL FLUTTER DEPENDENCIES"
          echo "========================================"

          flutter pub get

      # ==========================================
      # 9. FLUTTER DOCTOR
      # ==========================================
      - name: Flutter doctor
        shell
